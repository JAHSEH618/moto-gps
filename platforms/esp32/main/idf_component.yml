dependencies:
  waveshare/esp32_s3_touch_amoled_1_75c:
    version: "3.0.0"
  # Official board example uses this component for the onboard QMI8658.
  # We use its gyroscope only as a fast, short-term yaw increment; the phone's
  # motion course remains the long-term heading reference.
  waveshare/qmi8658:
    version: "^2.0.0"
  # The official Waveshare 1.75C LVGL-9 example pins 9.5.0. The source is the
  # repository submodule, registered as the project component `lvgl` in
  # ../CMakeLists.txt; the Component Manager prefers it over the registry copy
  # and never downloads one. An override_path would put this checkout's
  # absolute path into dependencies.lock and break every other checkout.
  lvgl/lvgl:
    version: "9.5.0"
    public: true
