name: Feature request
description: Suggest a portable SwiftUI design or validation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user, platform, accessibility, or stability problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest compatible solution and its interaction, accessibility, or performance implications.
    validations:
      required: true
